# Build and test on every push and pull request. Windows runner: the app targets .NET Framework 4.8
# and WinForms, which only build and run there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # SDK version comes from global.json so CI and local builds match.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test, build and package
        shell: pwsh
        run: ./scripts/build.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: CursorCloaker
          path: dist/*.zip
